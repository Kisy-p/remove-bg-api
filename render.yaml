services:
  - type: web
    name: background-remover-api
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "from rembg.bg import get_model; get_model('u2net')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: MAX_UPLOAD_SIZE
        value: 10485760  # 10MB en octets
    healthCheckPath: /health
    # Augmenter les limites de ressources
    autoscaling:
      minInstances: 0
      maxInstances: 1
      targetMemoryPercent: 80
    scaling:
      minInstances: 0
      maxInstances: 1
      targetMemoryPercent: 80
    startupTimeout: 600  # 10 minutes en secondes
