services:
  - type: web
    name: remove-bg-api
    env: python
    plan: free  # ou 'starter', 'standard', etc. selon ton offre payante
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
